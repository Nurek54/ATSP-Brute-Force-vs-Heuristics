  .chip:nth-of-type(3) { animation-delay: .5s; } .chip:nth-of-type(4) { animation-delay: .65s; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes t0 { 0%, 6% { stroke-dashoffset: 200; } 15%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t0 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t0 7.0s ease-in-out infinite; }
@keyframes t1 { 0%, 17% { stroke-dashoffset: 200; } 26%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t1 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t1 7.0s ease-in-out infinite; }
@keyframes t2 { 0%, 28% { stroke-dashoffset: 200; } 37%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t2 7.0s ease-in-out infinite; }
@keyframes t3 { 0%, 39% { stroke-dashoffset: 200; } 48%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t3 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t3 7.0s ease-in-out infinite; }
@keyframes t4 { 0%, 50% { stroke-dashoffset: 200; } 59%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t4 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t4 7.0s ease-in-out infinite; }
@keyframes t5 { 0%, 61% { stroke-dashoffset: 200; } 70%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } } .t5 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: t5 7.0s ease-in-out infinite; }
@keyframes cv { 0%, 70% { opacity: 0; } 76%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } } .cost { opacity: 0; animation: cv 7.0s infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chip, .cost { opacity: 1; } [class^="t"] { stroke-dashoffset: 0 !important; } }
</style>
