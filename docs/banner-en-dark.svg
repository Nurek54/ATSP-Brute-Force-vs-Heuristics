<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#17132A"/></linearGradient></defs>
<style>
  text { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
